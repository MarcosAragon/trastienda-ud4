<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi cesta - La Trastienda</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <header>
    <h1>Mi cesta</h1>
  </header>

  <main>

    <section>
      <h2>Productos</h2>

      <article>
        <img src="img/portada1.jpg" alt="Portada de La paciente silenciosa">
        <h3>La paciente silenciosa</h3>
        <p>Alex Michaelides · Tapa dura</p>
        <p>
          <button type="button">-</button>
          1
          <button type="button">+</button>
        </p>
        <p>19,90 €</p>
      </article>

      <article>
        <img src="img/portada2.jpg" alt="Portada de El silencio de la ciudad blanca">
        <h3>El silencio de la ciudad blanca</h3>
        <p>Eva García Sáenz de Urturi · Ebook</p>
        <p>
          <button type="button">-</button>
          1
          <button type="button">+</button>
        </p>
        <p>9,99 €</p>
      </article>
    </section>

    <section>
      <h2>Resumen del pedido</h2>
      <dl>
        <dt>Subtotal</dt>
        <dd>29,89 €</dd>
        <dt>Envío</dt>
        <dd>Gratis</dd>
        <dt>Total</dt>
        <dd>29,89 €</dd>
      </dl>
      <button type="button">Tramitar pedido</button>
    </section>

  </main>

  <nav aria-label="Secciones de la app">
    <ul>
      <li><a href="index.html">Inicio</a></li>
      <li><a href="#">Explorar</a></li>
      <li><a href="carrito.html" aria-current="page">Cesta</a></li>
      <li><a href="#">Perfil</a></li>
    </ul>
  </nav>

</body>
</html>
